# Server
server.port=8080

# MySQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Redis
spring.data.redis.url=${REDIS_HOST}

# Flyway — disabled in docker profile: schema already exists on Supabase.
# Flyway 11.x does not support PostgreSQL 17.x via the connection pooler;
# run migrations manually or via direct connection when needed.
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

# App domain (used in email links)
app.domain=${APP_DOMAIN}

# brewquery-engine base URL (used by WebClient)
engine.base-url=${ENGINE_BASE_URL:http://brewquery-engine:8081}

# Judge job URLs (used by SQLRemoteRepository)
judge.execute-url=${JUDGE_EXECUTE_URL:http://brewquery-engine:8081/jobs}
judge.run-testcases-url=${JUDGE_RUN_TESTCASES_URL:http://brewquery-engine:8081/jobs/test}

# Supabase Storage (used for avatar uploads)
# SUPABASE_STORAGE_BASE_URL  e.g. https://<project-ref>.supabase.co/storage/v1
supabase.storage.base-url=${SUPABASE_STORAGE_BASE_URL}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:brewquery_profile_picture}

# Multipart upload limit
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
