# Server
server.port=8080

# MySQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MongoDB
spring.data.mongodb.uri=${MONGO_URI}

# Redis
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# brewquery-engine base URL (used by WebClient)
engine.base-url=${ENGINE_BASE_URL:http://brewquery-engine:8081}

# Judge job URLs (used by SQLRemoteRepository)
judge.execute-url=${JUDGE_EXECUTE_URL:http://brewquery-engine:8081/jobs}
judge.run-testcases-url=${JUDGE_RUN_TESTCASES_URL:http://brewquery-engine:8081/jobs/test}
